name: examsai
description: "ExamsAi: AI tutor, practice questions and CBT mock exams for JAMB, WAEC and NECO."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  supabase_flutter: ^2.18.0
  in_app_purchase: ^3.3.0
  url_launcher: ^6.3.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#00B893"
  image: "assets/splash_logo.png"
  android_12:
    image: "assets/splash_logo.png"
    color: "#00B893"

flutter:
  uses-material-design: true
  assets:
    - assets/
